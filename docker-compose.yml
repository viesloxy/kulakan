# Kulakan — docker-compose (dev)  ·  GTNIC 2026
#
# Dev lokal: PostgreSQL 16 via Docker, aplikasi dijalankan native dengan
# `php artisan serve` + `npm run dev` (lihat README).
# Layanan app/web (Nginx/Caddy), queue, scheduler, dan node untuk parity
# produksi ditambahkan disini nanti bersama tim Ops.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kulakan}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # dev only: nonaktifkan password auth (kompatibilitas pdo_pgsql Windows vs scram PG16).
      # Produksi wajib pakai password sungguhan — jangan pakai trust.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # host 5433 (5432 dipakai PostgreSQL bawaan Laragon di mesin dev)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: